name: ccnc-mqtt-expiry
services:
  broker:
    image: eclipse-mosquitto:2.0.22
    ports:
      - "127.0.0.1:18883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - broker_data:/mosquitto/data
    restart: "no"
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.9.2
    ports:
      - "127.0.0.1:18123:8123"
    environment:
      TZ: UTC
    volumes:
      - ha_state:/config
      - ./ha/configuration.yaml:/config/configuration.yaml:ro
      - ./ha/packages:/config/packages:ro
    depends_on:
      - broker
    restart: "no"
volumes:
  broker_data:
  ha_state:
