  - event: expiry_v3_stage
    event_data:
      command_id: '{{ trigger.payload_json.command_id }}'
      case: physical_v3_execution_check
      policy: physical_v3_execution_check
      stage: finished
      expires_at_ms: '{{ trigger.payload_json.expires_at_ms }}'
  trace:
    stored_traces: 100
