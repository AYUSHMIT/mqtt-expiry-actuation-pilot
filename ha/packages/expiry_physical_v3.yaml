    qos: 1
  actions:
  - if:
    - condition: template
      value_template: '{{ (as_timestamp(now()) * 1000) >= (trigger.payload_json.expires_at_ms | float(0)) }}'
    then:
    - event: expiry_v3_stage
      event_data:
        command_id: '{{ trigger.payload_json.command_id }}'
        case: physical_v3_execution_check
        policy: physical_v3_execution_check
        stage: rejected
        reason: execution_check
        expires_at_ms: '{{ trigger.payload_json.expires_at_ms }}'
    - stop: application deadline expired immediately before service
  - event: expiry_v3_stage
