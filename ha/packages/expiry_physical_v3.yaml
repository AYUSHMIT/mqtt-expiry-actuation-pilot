# Hardened v3 physical endpoint design. No custom integration, no custom Python, no shell actions.
automation:
- id: mqtt_expiry_v3_ingress_probe
  alias: MQTT Expiry V3 Ingress Probe
  mode: parallel
  max: 100
  triggers:
  - trigger: mqtt
    topic: ccnc/expiry/v3/command/+
    qos: 1
  actions:
  - event: expiry_v3_received
    event_data:
      command_id: '{{ trigger.payload_json.command_id }}'
      case: '{{ trigger.topic.split(''/'')[-1] }}'
      queue_depth: '{{ trigger.payload_json.queue_depth }}'
      ttl_s: '{{ trigger.payload_json.ttl_s }}'
      expires_at_ms: '{{ trigger.payload_json.expires_at_ms }}'
      policy: '{{ trigger.payload_json.policy }}'
      role: '{{ trigger.payload_json.role }}'
      qos: '{{ trigger.qos }}'
  trace:
    stored_traces: 100
- id: mqtt_expiry_v3_physical_v3_broker_only
  alias: MQTT Expiry V3 Broker Only
  mode: queued
  max: 10
  triggers:
  - trigger: mqtt
    topic: ccnc/expiry/v3/command/physical_v3_broker_only
    qos: 1
  actions:
  - event: expiry_v3_stage
    event_data:
      command_id: '{{ trigger.payload_json.command_id }}'
      case: physical_v3_broker_only
      policy: physical_v3_broker_only
      stage: trigger_check
      expires_at_ms: '{{ trigger.payload_json.expires_at_ms }}'
  - event: expiry_v3_stage
    event_data:
      command_id: '{{ trigger.payload_json.command_id }}'
      case: physical_v3_broker_only
      policy: physical_v3_broker_only
      stage: pre_service
      expires_at_ms: '{{ trigger.payload_json.expires_at_ms }}'
  - action: switch.turn_on
    target:
      entity_id: switch.tapo_p110m
  - wait_template: '{{ is_state(''switch.tapo_p110m'', ''on'') }}'
    timeout: '00:00:10'
    continue_on_timeout: false
  - event: expiry_v3_stage
    event_data:
      command_id: '{{ trigger.payload_json.command_id }}'
      case: physical_v3_broker_only
      policy: physical_v3_broker_only
      stage: on_confirmed
      expires_at_ms: '{{ trigger.payload_json.expires_at_ms }}'
  - delay:
      seconds: 5
  - event: expiry_v3_stage
    event_data:
      command_id: '{{ trigger.payload_json.command_id }}'
      case: physical_v3_broker_only
      policy: physical_v3_broker_only
      stage: off_request
      expires_at_ms: '{{ trigger.payload_json.expires_at_ms }}'
  - action: switch.turn_off
    target:
      entity_id: switch.tapo_p110m
  - wait_template: '{{ is_state(''switch.tapo_p110m'', ''off'') }}'
    timeout: '00:00:10'
    continue_on_timeout: false
  - event: expiry_v3_stage
    event_data:
      command_id: '{{ trigger.payload_json.command_id }}'
      case: physical_v3_broker_only
      policy: physical_v3_broker_only
      stage: off_confirmed
      expires_at_ms: '{{ trigger.payload_json.expires_at_ms }}'
  - event: expiry_v3_stage
    event_data:
      command_id: '{{ trigger.payload_json.command_id }}'
      case: physical_v3_broker_only
      policy: physical_v3_broker_only
      stage: finished
      expires_at_ms: '{{ trigger.payload_json.expires_at_ms }}'
  trace:
    stored_traces: 100
- id: mqtt_expiry_v3_physical_v3_trigger_check
  alias: MQTT Expiry V3 Trigger Check
  mode: queued
  max: 10
  triggers:
  - trigger: mqtt
    topic: ccnc/expiry/v3/command/physical_v3_trigger_check
    qos: 1
  conditions:
  - condition: template
    value_template: '{{ (as_timestamp(now()) * 1000) < (trigger.payload_json.expires_at_ms | float(0)) }}'
  actions:
  - event: expiry_v3_stage
    event_data:
      command_id: '{{ trigger.payload_json.command_id }}'
      case: physical_v3_trigger_check
